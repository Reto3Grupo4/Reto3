<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="javascript.js"></script>
    <script>validarLogin();</script>
</head>
<body>
    <header>
        <div class="logo">
            <img src="img/logo.png" alt="Logo de la App" width="150">
            <h1>Aleph's Intranet</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Ir a la página principal</a></li>
            </ul>
        </nav>
    </header>
    <main class="login-container">
        <section class="login-box">
            <h2>Iniciar Sesión</h2>
            <form id="login-form" action="menu.html" method="get">
                <div class="grupo-de-entrada">
                    <label for="usuario">Usuario:</label>
                    <input type="text" id="usuario" name="usuario" required>
                </div>
                <div class="grupo-de-entrada">
                    <label for="contrasena">Contraseña:</label>
                    <input type="password" id="contrasena" name="contrasena" required>
                </div>
                <button type="submit" class="btn-primario" >Iniciar Sesión</button>
                
            </form>
            <div class="login-footer">
                <p>¿No tienes una cuenta? 
                <a href="registro.html" class="btn-secundario">Regístrate aquí</a></p>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Aleph's Intranet. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
