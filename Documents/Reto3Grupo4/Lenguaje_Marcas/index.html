<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aleph App</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="javascript.js"></script>
    <script>validarLogin();</script>
</head>
<body>

    <h1>Aleph App</h1>
    <header>
        <nav>
            <ul>
                <li><a href="login.html">Login</a></li>
                <li><a href="xml/canciones.xml">Canciones</a></li>
                <li><a href="xml/playlist.xml">Playlists</a></li>
                <li><a href="menu.html">Ir al menú</a></li>
            </ul>
        </nav>
        <img src="img/logo.png" alt="Logo de la App" width="200">
    </header>
    <main>
        <section class="contenedor-principal">
            <h2>¡Bienvenido a Nuestra App!</h2>
            <p>Explora nuestra amplia colección de música, descubre nuevos artistas y disfruta de tus canciones favoritas.</p>
            <form id="FormularioLogin" action="menu.html" method="get">
                <label for="usuario">Usuario:</label>
                <input type="text" id="usuario" name="usuario" required>
                </br>
                </br>
                <label for="contrasena">Contraseña:</label>
                <input type="password" id="contrasena" name="contrasena" required>
                <button type="submit">Entrar</button>
            </form>
        </section>
    </main>

    </footer>
